services:
  - type: worker
    name: torque-guide-telegram-bot
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
  - type: web
    name: unity-carrier-terms
    runtime: static
    buildCommand: echo "Static terms page, no build step"
    staticPublishPath: ./public
    domains:
      - terms.unitycarrier.com
    routes:
      - type: redirect
        source: /
        destination: /terms
      - type: rewrite
        source: /terms
        destination: /terms/index.html
