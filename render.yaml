services:
  - type: worker
    name: torque-guide-telegram-bot
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: BUSINESS_NAME
        value: Unity Performance
      - key: WHATSAPP_NUMBER
        sync: false
