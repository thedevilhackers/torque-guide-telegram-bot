<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unity Carrier tutorial</title>
<!--
  Tutorial video, drawn frame by frame: render(t) puts every element where it belongs at time t (seconds).
  render.js steps t at 25 fps, screenshots each frame and ffmpeg joins them. Open this file in a browser and
  call play() in the console to preview it in real time.
-->
<style>
:root {
    --bg: #050a14; --panel: #0c1526; --line: #1d2a44; --text: #eaf1ff; --muted: #93a4c3; --accent: #22b8f0; --accent2: #2f6bff;
    --ok: #26d07c; --warn: #ffb547;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
#stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(900px 500px at 85% 10%, rgba(47, 107, 255, .20), transparent 60%),
                radial-gradient(700px 500px at 0% 100%, rgba(34, 184, 240, .12), transparent 60%), var(--bg); }
.scene { position: absolute; inset: 0; opacity: 0; }
.abs { position: absolute; }

/* captions */
.cap { position: absolute; left: 44px; top: 70px; width: 392px; }
.cap .step { display: inline-flex; gap: 8px; align-items: center; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid rgba(34, 184, 240, .4); background: rgba(34, 184, 240, .08); }
.cap h2 { font-size: 31px; line-height: 1.15; margin: 16px 0 14px; letter-spacing: -.01em; }
.cap p { font-size: 18px; color: #c9d6ef; margin: 0 0 12px; }
.cap .hint { font-size: 15px; color: var(--muted); border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin-top: 18px; }
.cap code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.cap code { color: #fff; background: rgba(255, 255, 255, .08); padding: 1px 6px; border-radius: 6px; font-size: .92em; }
.cap b { color: #fff; }

/* chapter bar */
#chapters { position: absolute; left: 44px; right: 44px; bottom: 22px; display: flex; gap: 8px; opacity: 0; }
#chapters div { flex: 1; height: 30px; border-radius: 8px; background: rgba(255, 255, 255, .05); color: var(--muted); font-size: 13px;
    font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; overflow: hidden; }
#chapters div i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); opacity: .35; width: 0; }
#chapters div span { position: relative; }
#chapters div.on { color: #fff; }

/* browser */
.browser { position: absolute; left: 470px; top: 58px; width: 780px; height: 560px; border-radius: 14px; overflow: hidden;
    background: #fff; box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08); }
.browser .bar { height: 34px; background: #e9edf3; display: flex; align-items: center; gap: 7px; padding: 0 12px; }
.browser .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; }
.browser .bar i:nth-child(2) { background: #febc2e; } .browser .bar i:nth-child(3) { background: #28c840; }
.browser .url { margin-left: 12px; flex: 1; height: 22px; border-radius: 7px; background: #fff; color: #333; font-size: 12.5px; display: flex;
    align-items: center; padding: 0 10px; gap: 6px; }
.browser .url::before { content: "🔒"; font-size: 10px; }
.browser .view { position: absolute; left: 0; right: 0; top: 34px; bottom: 0; overflow: hidden; background: #f4f6fb; }
.layer { position: absolute; inset: 0; opacity: 0; }
.layer img { position: absolute; left: 0; top: 0; width: 100%; }

/* MagnusBilling-style screens (simplified) */
.mb-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #0f3d7a 0%, #1f6fbf 45%, #63b3ed 100%); }
.mb-login { position: absolute; left: 50%; top: 50%; width: 330px; transform: translate(-50%, -50%); background: rgba(255, 255, 255, .96);
    border-radius: 14px; padding: 26px 26px 22px; color: #1d2b44; box-shadow: 0 20px 50px rgba(0, 0, 0, .3); }
.mb-login .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .02em; margin-bottom: 14px; }
.logo-mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--accent2), var(--accent)); display: grid; place-items: center; }
.logo-mark svg { width: 19px; height: 19px; color: #fff; }
.mb-login h3 { margin: 0 0 14px; font-size: 16px; color: #52627d; font-weight: 600; }
.in { height: 38px; border: 1px solid #ccd5e3; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; padding: 0 12px;
    font-size: 14px; color: #1d2b44; background: #fff; position: relative; }
.in.ph { color: #9aa7bb; }
.in.focus { border-color: #2f6bff; box-shadow: 0 0 0 3px rgba(47, 107, 255, .18); }
.in .lbl { position: absolute; top: -8px; left: 9px; background: #fff; padding: 0 4px; font-size: 10.5px; color: #6b7a93; }
.btnx { height: 38px; border-radius: 8px; background: #2f6bff; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.btnx.ghost { background: transparent; color: #2f6bff; border: 1px solid #c9d7f5; }
.mb-login .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mb-flag { position: absolute; right: 16px; top: 14px; font-size: 12px; color: #fff; background: rgba(0, 0, 0, .25); border-radius: 6px; padding: 3px 8px; }
.mb-signup { width: 430px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #42526e; margin: 4px 0 12px; }
.check b { width: 17px; height: 17px; border-radius: 4px; border: 1.5px solid #9aa7bb; display: grid; place-items: center; font-size: 12px; color: #fff; }
.check b.on { background: #2f6bff; border-color: #2f6bff; }
.toast { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); background: #0f9d58; color: #fff; padding: 10px 18px; border-radius: 10px;
    font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); white-space: nowrap; opacity: 0; }

.desk { position: absolute; inset: 0; background: linear-gradient(160deg, #cfe3f7 0%, #a9c8ea 50%, #87b0de 100%); }
.desk .top { position: absolute; left: 0; right: 0; top: 0; height: 30px; background: rgba(255, 255, 255, .7); display: flex; align-items: center;
    justify-content: space-between; padding: 0 14px; font-size: 12.5px; color: #33415c; }
.desk .icons { position: absolute; right: 18px; top: 44px; display: grid; grid-template-columns: repeat(2, 86px); gap: 12px 8px; }
.dicon { display: grid; justify-items: center; gap: 4px; font-size: 11.5px; color: #1d2b44; font-weight: 600; text-align: center; position: relative; }
.dicon b { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 25px; box-shadow: 0 4px 12px rgba(0, 0, 0, .12); }
.dock { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 8px; padding: 7px 10px; border-radius: 16px;
    background: rgba(255, 255, 255, .45); }
.dock b { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; }
.ring { position: absolute; border: 3px solid #ffb547; border-radius: 16px; box-shadow: 0 0 0 6px rgba(255, 181, 71, .25); opacity: 0; pointer-events: none; }

.win { position: absolute; background: #fff; border-radius: 10px; box-shadow: 0 18px 50px rgba(0, 0, 0, .3); overflow: hidden; opacity: 0; }
.win .wt { height: 30px; background: #f1f4f9; border-bottom: 1px solid #dfe5ee; display: flex; align-items: center; padding: 0 12px; font-size: 12.5px;
    font-weight: 700; color: #33415c; justify-content: space-between; }
.win .wt span:last-child { color: #8a97ad; font-weight: 400; }
.tb { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid #e6ebf2; }
.tb span { font-size: 12px; padding: 5px 10px; border: 1px solid #d5dde9; border-radius: 6px; color: #33415c; background: #fff; }
.tb span.hl { border-color: #2f6bff; color: #2f6bff; font-weight: 700; }
.grid { font-size: 12.5px; color: #33415c; }
.grid .gh, .grid .gr { display: grid; grid-template-columns: 1.1fr 1fr 1.6fr; padding: 8px 12px; border-bottom: 1px solid #eef1f6; }
.grid .gh { font-weight: 700; color: #6b7a93; background: #fafbfd; }
.grid .gr.sel { background: #e8f0ff; }
.form { padding: 14px; font-size: 12.5px; }
.form .f { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; margin-bottom: 9px; color: #6b7a93; }
.form .f div { height: 30px; border: 1px solid #d5dde9; border-radius: 6px; display: flex; align-items: center; padding: 0 9px; color: #1d2b44;
    justify-content: space-between; }
.infobox { margin: 12px 14px 0; padding: 10px 12px; border-radius: 8px; background: #eaf7f0; color: #0b6b3a; font-size: 13px; font-weight: 600; opacity: 0; }

/* crypto checkout (example) */
.co { position: absolute; inset: 0; background: #f6f7fb; display: grid; place-items: center; opacity: 0; }
.co .box { width: 380px; background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(20, 30, 60, .12); padding: 22px; color: #1d2b44; }
.co h4 { margin: 0 0 4px; font-size: 13px; color: #6b7a93; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.co .amt { font-size: 28px; font-weight: 800; margin-bottom: 14px; }
.coins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.coins div { border: 1px solid #dfe5ee; border-radius: 9px; padding: 9px 6px; text-align: center; font-size: 13px; font-weight: 700; }
.coins div.on { border-color: #2f6bff; background: #eef3ff; color: #2f6bff; }
.co .send { margin-top: 14px; display: grid; grid-template-columns: 86px 1fr; gap: 12px; align-items: center; opacity: 0; }
.qr { width: 86px; height: 86px; border-radius: 8px;
    background: repeating-conic-gradient(#1d2b44 0 25%, #fff 0 50%) 0 0 / 14px 14px; outline: 6px solid #fff; outline-offset: -6px; }
.co .status { margin-top: 14px; padding: 9px 12px; border-radius: 9px; font-size: 13.5px; font-weight: 700; background: #fff6e5; color: #9a5b00; opacity: 0; }
.co .status.ok { background: #e7f8ef; color: #0b7a43; }
.balfix { position: absolute; background: #fff; font-weight: 800; color: #172033; display: flex; align-items: center; justify-content: flex-end; opacity: 0; }

/* phones */
.phone { position: absolute; left: 640px; top: 40px; width: 300px; height: 620px; border-radius: 40px; background: #0b0f19; padding: 12px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 2px #2a3550; }
.phone .scr { position: absolute; inset: 12px; border-radius: 30px; overflow: hidden; background: #fff; }
.phone .notch { position: absolute; left: 50%; top: 20px; width: 84px; height: 20px; transform: translateX(-50%); background: #0b0f19; border-radius: 12px; z-index: 5; }

.tg { position: absolute; inset: 0; background: #dfe9f3; }
.tg .hd { position: absolute; left: 0; right: 0; top: 0; height: 88px; background: #fff; display: flex; align-items: flex-end; gap: 10px; padding: 0 14px 10px;
    border-bottom: 1px solid #e3e8ef; z-index: 2; }
.tg .hd .av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent2), var(--accent)); display: grid; place-items: center;
    color: #fff; font-size: 16px; }
.tg .hd b { display: block; font-size: 14px; color: #1d2b44; }
.tg .hd small { color: #7a889f; font-size: 11.5px; }
.tg .msgs { position: absolute; left: 0; right: 0; top: 88px; bottom: 50px; overflow: hidden; }
.tg .track { position: absolute; left: 10px; right: 10px; bottom: 8px; display: flex; flex-direction: column; gap: 7px; }
.bub { max-width: 84%; padding: 8px 11px; border-radius: 14px; font-size: 12.5px; line-height: 1.38; color: #1d2b44; background: #fff; white-space: pre-line;
    box-shadow: 0 1px 1px rgba(0, 0, 0, .06); display: none; }
.bub.me { align-self: flex-end; background: #e1fec6; }
.bub .kb { display: grid; gap: 4px; margin-top: 7px; }
.bub .kb div { display: grid; gap: 4px; grid-auto-flow: column; grid-auto-columns: 1fr; }
.bub .kb span { background: rgba(47, 107, 255, .1); color: #2559d8; border-radius: 8px; padding: 6px 4px; text-align: center; font-weight: 700; font-size: 12px; }
.bub .kb span.tap { background: #2f6bff; color: #fff; }
.tg .inp { position: absolute; left: 0; right: 0; bottom: 0; height: 50px; background: #fff; border-top: 1px solid #e3e8ef; display: flex; align-items: center;
    padding: 0 14px; color: #9aa7bb; font-size: 13px; }

.sip { position: absolute; inset: 0; background: #f3f5f9; color: #1d2b44; }
.sip .hd { height: 88px; display: flex; align-items: flex-end; padding: 0 16px 10px; font-weight: 800; font-size: 16px; background: #fff; border-bottom: 1px solid #e3e8ef; }
.sip .body { padding: 14px; }
.sip .sf { margin-bottom: 9px; }
.sip .sf small { display: block; font-size: 11px; color: #7a889f; margin-bottom: 3px; }
.sip .sf div { height: 34px; border-radius: 8px; background: #fff; border: 1px solid #d9e0ea; display: flex; align-items: center; padding: 0 10px; font-size: 13.5px; }
.sip .sf div.focus { border-color: #2f6bff; box-shadow: 0 0 0 3px rgba(47, 107, 255, .15); }
.sip .acc { margin: 14px; background: #fff; border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #26c165; margin-right: 6px; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 6px 26px; }
.pad b { height: 50px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 20px; font-weight: 600; color: #1d2b44;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }
.num { text-align: center; font-size: 23px; font-weight: 700; letter-spacing: .04em; height: 46px; display: flex; align-items: center; justify-content: center; }
.callbtn { width: 58px; height: 58px; border-radius: 50%; background: #26c165; margin: 10px auto 0; display: grid; place-items: center; color: #fff; font-size: 24px; }
.incall { position: absolute; inset: 0; background: linear-gradient(180deg, #1c2b4a, #0b1222); color: #fff; display: grid; place-items: center; text-align: center; opacity: 0; }
.incall .av { width: 86px; height: 86px; border-radius: 50%; background: rgba(255, 255, 255, .1); display: grid; place-items: center; font-size: 36px; margin: 0 auto 14px; }
.hang { width: 58px; height: 58px; border-radius: 50%; background: #ef4444; display: grid; place-items: center; margin: 26px auto 0; font-size: 24px; }

.perm { position: absolute; background: #fff; border-radius: 10px; box-shadow: 0 12px 34px rgba(0, 0, 0, .3); padding: 14px; width: 300px; color: #1d2b44;
    font-size: 13px; opacity: 0; }
.perm .pb { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.perm .pb span { padding: 6px 14px; border-radius: 6px; border: 1px solid #d5dde9; font-weight: 600; }
.perm .pb span:last-child { background: #2f6bff; color: #fff; border-color: #2f6bff; }

/* cursor */
#cursor { position: absolute; left: 0; top: 0; width: 26px; height: 26px; z-index: 50; opacity: 0; pointer-events: none; }
#ripple { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid #ffb547; z-index: 49; opacity: 0; }

/* intro / outro */
.center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.big-logo { width: 92px; height: 92px; border-radius: 24px; background: linear-gradient(135deg, var(--accent2), var(--accent)); display: grid; place-items: center;
    margin: 0 auto 22px; box-shadow: 0 20px 60px rgba(34, 184, 240, .35); }
.big-logo svg { width: 50px; height: 50px; color: #fff; }
.brand { font-size: 46px; font-weight: 800; letter-spacing: .04em; }
.sub { font-size: 22px; color: #b8c7e3; margin-top: 8px; }
.pills { display: flex; gap: 10px; justify-content: center; margin-top: 26px; }
.pills span { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); font-size: 16px; }
.cards3 { position: absolute; left: 470px; top: 110px; width: 780px; display: grid; gap: 16px; }
.card3 { display: grid; grid-template-columns: 64px 1fr; gap: 18px; align-items: center; padding: 20px 22px; border-radius: 16px;
    background: rgba(255, 255, 255, .04); border: 1px solid var(--line); opacity: 0; }
.card3 b.n { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; font-size: 30px;
    background: linear-gradient(135deg, rgba(47, 107, 255, .35), rgba(34, 184, 240, .25)); }
.card3 h3 { margin: 0 0 4px; font-size: 22px; }
.card3 p { margin: 0; color: var(--muted); font-size: 16px; }
.overlay-note { position: absolute; background: #0c1526; color: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px;
    width: 300px; box-shadow: 0 16px 40px rgba(0, 0, 0, .45); opacity: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<svg width="0" height="0" style="position:absolute">
    <symbol id="phone-ico" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="currentColor"/><path d="M15 3.5a6 6 0 0 1 5.5 5.5M15 7a2.5 2.5 0 0 1 2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>
<script>
'use strict';
const BOXES = window.BOXES || {};
const stage = document.getElementById('stage');
const LOGO = '<svg><use href="#phone-ico"/></svg>';
const SERVER = 'www.unitycarrier.com';
const PANEL_URL = 'https://www.unitycarrier.com/panel/';
const PAY_URL = 'https://pay.unitycarrier.com/pay/';

// ------------------------------------------------------------------ helpers
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const fade = (t, t0, d = .35) => ease((t - t0) / d);
const fadeIO = (t, t0, t1, d = .35) => Math.min(fade(t, t0, d), 1 - fade(t, t1, d));
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
const $ = (root, sel) => root.querySelector(sel);
const typed = (t, t0, text, cps = 14) => text.slice(0, Math.max(0, Math.floor((t - t0) * cps)));
const dots = (n) => '•'.repeat(n);
function caret(t, show) { return show && Math.floor(t * 2) % 2 === 0 ? '|' : ''; }
function setInput(node, value, placeholder, focus) {
    node.firstChild.nodeValue = value !== '' ? value : placeholder;
    node.classList.toggle('ph', value === '');
    node.classList.toggle('focus', !!focus);
}
function path(t, pts) {
    if (t <= pts[0][0]) return [pts[0][1], pts[0][2]];
    for (let i = 1; i < pts.length; i++) {
        if (t <= pts[i][0]) {
            const k = ease((t - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]));
            return [pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k, pts[i - 1][2] + (pts[i][2] - pts[i - 1][2]) * k];
        }
    }
    const last = pts[pts.length - 1];
    return [last[1], last[2]];
}
// Screenshot geometry: point on a screenshot (CSS px of the captured page) -> stage px.
function shotPoint(shot, key, frame, scroll = 0) {
    const b = BOXES[shot][key];
    const s = frame.w / BOXES[shot]._size.w;
    return [frame.x + (b.x + b.w / 2) * s, frame.y + 34 + (b.y + b.h / 2) * s - scroll];
}
const BROWSER = { x: 470, y: 58, w: 780 };

// ------------------------------------------------------------------ shared pieces
const cursor = el('<svg id="cursor" viewBox="0 0 26 26"><path d="M4 2l17 10.5-7.6 1.7 4.6 8.3-3.3 1.8-4.6-8.4L4 21z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>');
const ripple = el('<div id="ripple"></div>');
const chapters = el(`<div id="chapters">
    <div><i></i><span>1 · Account</span></div><div><i></i><span>2 · Top up</span></div><div><i></i><span>3 · SIP app</span></div>
    <div><i></i><span>4 · Browser call</span></div><div><i></i><span>Extras</span></div></div>`);

function browser(url, layersHtml) {
    return `<div class="browser"><div class="bar"><i></i><i></i><i></i><div class="url">${url}</div></div><div class="view">${layersHtml}</div></div>`;
}
function caption(step, title, body, hint) {
    return `<div class="cap"><span class="step">${step}</span><h2>${title}</h2>${body}${hint ? `<p class="hint">${hint}</p>` : ''}</div>`;
}
const loginCard = `<div class="mb-login">
    <div class="logo"><span class="logo-mark">${LOGO}</span>UNITY CARRIER</div>
    <h3>Sign into your account</h3>
    <div class="in ph" data-k="user">Username or email</div>
    <div class="in ph" data-k="pass">Password</div>
    <div class="btnx" data-k="login">Login</div>
    <div class="btnx ghost" style="margin-top:10px" data-k="create">Create an account</div>

        node.classList.toggle('focus', t >= t0 && t < (fields[i + 1] ? fields[i + 1][2] : 7.4));
    });
    $(n, '[data-k=form]').style.opacity = 1 - fade(t, 8.6);
    $(n, '[data-k=dial]').style.opacity = fade(t, 8.6);
    const digits = typed(t, 10.6, '447700900123', 5);
    $(n, '[data-k=num]').textContent = digits.replace(/^(\d{2})(\d{0,4})(\d{0,6})$/, (m, a, b, cc) => [a, b, cc].filter(Boolean).join(' '));
    $(n, '[data-k=incall]').style.opacity = fade(t, 14.4);
    const sec = Math.max(0, Math.floor(t - 15.6));
    $(n, '[data-k=timer]').textContent = t < 15.6 ? 'Calling…' : `00:0${Math.min(sec, 9)}`;
    c.cursor = t < 8.6 ? [[0, 1100, 640], [7.6, ...nodePoint($(n, '[data-k=save]'))], [8.4, ...nodePoint($(n, '[data-k=save]'))]]
        : [[8.6, 790, 560], [13.4, ...nodePoint($(n, '[data-k=call]'))], [14.4, ...nodePoint($(n, '[data-k=call]'))], [16, 1120, 640]];
    c.clicks = [8.1, 13.9];
}, 2);

null, (t, n, c) => {

    $(n, '[data-k=incall]').style.opacity = fade(t, 12.4);

stage.appendChild(chapters);

// ------------------------------------------------------------------ render
function cursorAt(s, local) {
    const c = s.ctx;
    if (!c.cursor) return null;
    const pts = c.cursor.map(p => {
        if (p.length === 4) { const [x, y] = nodePoint(c.targets[p[3]]); return [p[0], x, y]; }
        return p;
    });
    return path(local, pts);
}

window.render = function (t) {
    let active = null;
    for (const s of scenes) {
        const local = t - s.start;
        const vis = Math.min(fade(local, -.01, .45), 1 - fade(local, s.dur - .45, .45));
        s.node.style.opacity = vis;
        s.node.style.visibility = vis > 0 ? 'visible' : 'hidden';
        if (vis > 0 || (local >= 0 && local < s.dur)) {
            s.update(local, s.node, s.ctx);
            if (local >= 0 && local < s.dur) active = s;
        }
    }
    // chapters
    const ch = active ? active.chapter : -1;
    chapters.style.opacity = ch >= 0 ? 1 : 0;
    const bounds = [[14.5, 46.5], [46.5, 97.5], [97.5, 130.5], [130.5, 148.5], [148.5, 161.5]];
    chapters.querySelectorAll('div').forEach((d, i) => {
        d.classList.toggle('on', i === ch);
        d.querySelector('i').style.width = (clamp((t - bounds[i][0]) / (bounds[i][1] - bounds[i][0])) * 100) + '%';
    });
    // cursor
    let pos = null, local = 0;
    if (active) { local = t - active.start; pos = cursorAt(active, local); }
    if (pos) {
        const clicks = active.ctx.clicks || [];
        const since = clicks.map(c => local - c).filter(d => d >= 0 && d < .5);
        const press = since.length && since[0] < .16;
        cursor.style.opacity = Math.min(fade(local, .2), 1 - fade(local, active.dur - .6));
        cursor.style.transform = `translate(${pos[0] - 4}px, ${pos[1] - 2}px) scale(${press ? .85 : 1})`;
        if (since.length) {
            const k = since[0] / .5;
            ripple.style.opacity = 1 - k;
            ripple.style.left = pos[0] + 'px';
            ripple.style.top = pos[1] + 'px';
            ripple.style.transform = `scale(${.4 + k * 1.1})`;
        } else {
            ripple.style.opacity = 0;
        }
    } else {
        cursor.style.opacity = 0;
        ripple.style.opacity = 0;
    }
};

// Real-time preview in a browser: play()
window.play = function (from = 0) {
    const t0 = performance.now() - from * 1000;
    (function tick() { const t = (performance.now() - t0) / 1000; render(t); if (t < window.DURATION) requestAnimationFrame(tick); })();
};
render(0);
</script>
